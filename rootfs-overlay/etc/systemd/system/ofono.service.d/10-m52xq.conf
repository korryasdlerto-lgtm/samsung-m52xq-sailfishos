# ofono 2.x (qrtrqmi) needs the provisioning session and the rmnet links first.
[Unit]
After=m52xq-modem-prep.service
Wants=m52xq-modem-prep.service

# ofono 2.12 has no --nobacktrace (Jolla 1.29 unit): it exited at once with status 1
[Service]
ExecStart=
ExecStart=/usr/sbin/ofonod -n $OFONO_ARGS $OFONO_DEBUG
