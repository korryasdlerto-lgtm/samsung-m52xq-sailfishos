; Samsung Galaxy M52 5G (m52xq) on mainline: sensors behind the ADSP (SSC: lsm6dsm accel/gyro, ak0991x mag, stk3a9x als/prox),
; read through libssc 0.4.4 (m52xq patch 0002) by the sensorfw-qt5-ssc adaptors (moWerk/sailfishos-pro1x-mainline, no step counter).
; Needs hexagonrpcd-adsp-sensorspd running.
[plugins]
accelerometeradaptor = sscaccelerometeradaptor
gyroscopeadaptor = sscgyroscopeadaptor
magnetometeradaptor = sscmagnetometeradaptor
alsadaptor = sscalsadaptor
proximityadaptor = sscproximityadaptor

; 20-sensors-default.conf ties these to Feature_* flags from hw-release (no droid-config here): enable them directly
[available]
accelerometersensor = True
alssensor = True
compasssensor = True
gyroscopesensor = True
orientationsensor = True
proximitysensor = True
magnetometersensor = True
rotationsensor = True

; Frame: identity first (as on the pro1x: the SSC reports in the phone frame; the iio-sensor-proxy ACCEL_MOUNT_MATRIX
; -1,-1,1 of the Debian/pmOS ports is for the iio path) — check the auto-rotation.
[accelerometer]
transformation_matrix = "1,0,0,0,1,0,0,0,1"

[gyroscope]
transformation_matrix = "1,0,0,0,1,0,0,0,1"

[magnetometer]
transformation_matrix = "1,0,0,0,1,0,0,0,1"
scale_coefficient = 1
needs_calibration = 0
