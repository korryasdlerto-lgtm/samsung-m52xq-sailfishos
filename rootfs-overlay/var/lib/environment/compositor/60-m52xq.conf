# m52xq (Galaxy M52 5G, mainline + Mesa freedreno): lipstick through Qt eglfs on KMS, no libhybris
QT_QPA_PLATFORM=eglfs
QT_QPA_EGLFS_INTEGRATION=eglfs_kms
QT_QPA_EGLFS_KMS_CONFIG=/var/lib/environment/compositor/m52xq-kms.json
QT_QPA_EGLFS_HIDECURSOR=1
QT_QPA_EGLFS_PHYSICAL_WIDTH=70
QT_QPA_EGLFS_PHYSICAL_HEIGHT=155
EGL_PLATFORM=drm
LIPSTICK_OPTIONS="-plugin evdevtouch:/dev/input/event2 -plugin evdevkeyboard:/dev/input/event4"
QT_QPA_EVDEV_KEYBOARD_PARAMETERS=keymap=/usr/share/qt5/keymaps/droid.qmap
