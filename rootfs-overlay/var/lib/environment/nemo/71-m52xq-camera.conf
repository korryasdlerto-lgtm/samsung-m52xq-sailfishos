# m52xq: jolla-camera on libcamera (inner source of wrappercamerabinsrc; do NOT set QT_GSTREAMER_CAMERABIN_SRC)
QT_GSTREAMER_CAMERABIN_VIDEOSRC=libcamerasrc
# the main camera (64 MP) first: in the sandbox (no /sys/firmware) libcamera names the cameras by the sensor ("... 16-002d s5kgw3"),
# the macro gc5035 came first there
QT_GSTREAMER_CAMERA_FIRST=s5kgw3
# video recording: AAC comes from libav (registered with rank none)
GST_PLUGIN_FEATURE_RANK=avenc_aac:primary
# flash: /sys is read-only in the sandbox: the LED is switched through the session service org.sailfish.flashlight.provider (m52xq-flashlight)
QT_GSTREAMER_CAMERA_FLASH_LEDS=white:flash
QT_GSTREAMER_CAMERA_FLASH_DBUS=1
